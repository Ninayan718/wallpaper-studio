<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="壁纸台">
<meta name="theme-color" content="#FBF8F3">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>壁纸台 · 手机壁纸生成器</title>
<style>:root{
  --bg:#FBF8F3; --card:#FFFFFF; --ink:#302B38; --muted:#8D8794;
  --line:#EFE9E0; --accent:#9B7BD8; --accent-2:#E4A9C6; --soft:#F3EEFA;
  --shadow:0 6px 24px rgba(72,50,100,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:14px;line-height:1.5;overflow-x:hidden;
}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.app{max-width:520px;margin:0 auto;min-height:100vh;position:relative}
.topbar{
  position:sticky;top:0;z-index:30;background:rgba(251,248,243,.94);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;
  display:flex;align-items:center;justify-content:space-between;
}
.brand{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:700;letter-spacing:.5px}
.brand-mark{
  width:26px;height:26px;border-radius:9px;
  background:linear-gradient(145deg,#BFA3EE,#E9AFC8 60%,#F6D9B0);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.6);position:relative;overflow:hidden;
}
.brand-mark:after{content:"";position:absolute;left:3px;right:3px;bottom:3px;height:9px;background:rgba(255,255,255,.82);clip-path:polygon(0 100%,32% 22%,55% 70%,76% 38%,100% 100%)}
.brand small{display:block;font-size:10px;color:var(--muted);font-weight:500;letter-spacing:1.6px;margin-top:-2px}
.top-note{font-size:11px;color:var(--muted);text-align:right;line-height:1.35}
main{padding:16px 16px calc(96px + env(safe-area-inset-bottom));display:block}
.tabpane{display:none;animation:fade .22s ease}
.tabpane.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* 通用卡片 */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:14px;margin-bottom:14px}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-h h2{font-size:14px;margin:0;font-weight:700;letter-spacing:.2px}
.card-h .hint{font-size:11px;color:var(--muted)}
.muted{color:var(--muted)}
.tiny{font-size:11px}

/* 尺寸 */
.sizebar{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.sizebar .lbl{font-size:12px;color:var(--muted);white-space:nowrap}
.select-wrap{position:relative;flex:1;min-width:0}
.select-wrap:after{content:"";position:absolute;right:13px;top:50%;width:7px;height:7px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
select{
  width:100%;min-width:0;max-width:100%;appearance:none;-webkit-appearance:none;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:9px 32px 9px 12px;font-size:12.5px;font-weight:600;
  text-overflow:ellipsis;white-space:nowrap;overflow:hidden;
}
.size-dims{font-size:11px;color:var(--muted);white-space:nowrap}

/* 画布 */
.stage-shell{
  background:linear-gradient(160deg,#F2ECF7,#FDF2EA);border:1px solid var(--line);
  border-radius:22px;padding:13px 12px;box-shadow:var(--shadow);margin-bottom:12px;
  display:flex;justify-content:center;align-items:center;
}
.stage{position:relative;width:100%;max-width:236px;border-radius:13px;overflow:hidden;box-shadow:0 10px 28px rgba(60,40,90,.2);background:#ddd}
.stage canvas{display:block;width:100%;height:auto;touch-action:none}
.stage-badge{
  position:absolute;left:10px;top:10px;padding:4px 9px;border-radius:20px;
  background:rgba(30,25,40,.42);color:#fff;font-size:10px;backdrop-filter:blur(8px);pointer-events:none;
}
.stage-tip{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:10px;color:rgba(255,255,255,.85);text-shadow:0 1px 3px rgba(0,0,0,.5);pointer-events:none}
.actions{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:9px;margin-bottom:14px}
.btn{
  border-radius:13px;padding:11px 8px;font-size:12.5px;font-weight:700;text-align:center;
  background:var(--card);border:1px solid var(--line);box-shadow:0 2px 8px rgba(70,50,90,.04);
  transition:transform .12s,opacity .12s;
}
.btn:active{transform:scale(.97);opacity:.8}
.btn.primary{background:linear-gradient(135deg,var(--accent),#C08AD0);color:#fff;border-color:transparent;box-shadow:0 5px 14px rgba(150,105,205,.3)}
.btn.ghost{background:var(--soft);color:#7C5DB8;border-color:transparent}
.btn.wide{width:100%}
.btn.danger{color:#C26072}

/* 分段控件 */
.seg{display:flex;background:#F3EFE9;border-radius:13px;padding:4px;gap:2px;margin-bottom:14px}
.seg button{flex:1;padding:8px 2px;border-radius:10px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:#fff;color:var(--accent);box-shadow:0 2px 8px rgba(70,50,90,.09)}
.panel{display:none}
.panel.on{display:block}

/* 分类 chips */
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:11px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:6px 13px;border-radius:20px;background:#F5F1EC;font-size:11.5px;color:var(--muted);white-space:nowrap;font-weight:600}
.chip.on{background:var(--soft);color:#7C5DB8}
.thumb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.thumb{
  position:relative;aspect-ratio:9/16;border-radius:11px;overflow:hidden;border:2px solid transparent;
  background:#eee;box-shadow:0 3px 9px rgba(60,40,90,.1);
}
.thumb.on{border-color:var(--accent)}
.thumb canvas{display:block;width:100%;height:100%}
.thumb-name{position:absolute;left:0;right:0;bottom:0;padding:10px 3px 4px;font-size:10px;color:#fff;text-align:center;background:linear-gradient(transparent,rgba(0,0,0,.42));text-shadow:0 1px 2px rgba(0,0,0,.4)}
.thumb-shuffle{position:absolute;right:4px;top:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;font-size:12px;line-height:22px;text-align:center;backdrop-filter:blur(4px)}

/* 表单 */
.field{margin-bottom:14px}
.field:last-child{margin-bottom:0}
.field-label{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:7px}
.field-label b{color:var(--ink);font-weight:600}
input[type=range]{width:100%;appearance:none;-webkit-appearance:none;height:4px;border-radius:4px;background:#E9E3EC;outline:none;margin:6px 0}
input[type=range]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--accent);box-shadow:0 2px 6px rgba(90,60,130,.25)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--accent)}
input[type=text],textarea{
  width:100%;border:1px solid var(--line);background:#FDFBF8;border-radius:11px;
  padding:10px 12px;font-size:13px;outline:none;resize:vertical;
}
input[type=text]:focus,textarea:focus{border-color:var(--accent);background:#fff}
input[type=color]{width:38px;height:32px;border:1px solid var(--line);border-radius:9px;padding:2px;background:#fff}
.color-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.color-dot{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}
.color-dot.on{box-shadow:0 0 0 2px var(--accent)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.toggle-row:last-child{border-bottom:0}
.toggle{width:42px;height:24px;border-radius:20px;background:#E5E0E7;position:relative;transition:background .2s}
.toggle.on{background:var(--accent)}
.toggle:after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.toggle.on:after{transform:translateX(18px)}
.mini-btns{display:flex;gap:7px;flex-wrap:wrap}
.mini{padding:7px 11px;border-radius:9px;background:#F5F1EC;font-size:11.5px;font-weight:600;color:#6E6876}
.mini.on{background:var(--soft);color:#7C5DB8}
.mini.outline{background:#fff;border:1px solid var(--line)}

/* 文字列表 */
.text-item{
  display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:11px;
  background:#FAF7F3;border:1px solid var(--line);margin-bottom:7px;
}
.text-item.on{border-color:var(--accent);background:var(--soft)}
.text-item .ti-txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.text-item .ti-x{color:var(--muted);font-size:16px;padding:0 3px}
.text-item .ti-eye{font-size:13px;color:var(--muted)}
.quote-grid{display:flex;gap:7px;overflow-x:auto;padding:2px 0 5px;scrollbar-width:none}
.quote-grid::-webkit-scrollbar{display:none}
.quote-grid button{white-space:nowrap;padding:7px 11px;border-radius:18px;background:#F7F3EF;font-size:11px;color:#6E6876}

/* 图库页 */
.gallery-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.gallery-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.gallery-grid .thumb{border-radius:15px}
.gallery-card{position:relative}
.gallery-empty{padding:40px 10px;text-align:center;color:var(--muted);font-size:12px}

/* 作品页 */
.work-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.work{border-radius:14px;overflow:hidden;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}
.work img{display:block;width:100%;aspect-ratio:9/16;object-fit:cover;background:#eee}
.work-meta{padding:8px 10px;font-size:10.5px;color:var(--muted)}
.work-meta b{display:block;font-size:11.5px;color:var(--ink);font-weight:600;margin-bottom:1px}
.work-del{position:absolute;right:7px;top:7px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.4);color:#fff;font-size:13px;line-height:24px;text-align:center}
.work-wrap{position:relative}

/* 底部导航 */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:520px;margin:0 auto;
  background:rgba(255,255,255,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:flex;padding:7px 6px calc(7px + env(safe-area-inset-bottom));
}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0;color:var(--muted)}
.tabbar button.on{color:var(--accent)}
.tabbar .ic{font-size:19px;line-height:1.1}
.tabbar .tx{font-size:10px;font-weight:600}

/* 提示 */
.toast{
  position:fixed;left:50%;bottom:100px;transform:translate(-50%,12px);z-index:99;
  background:rgba(42,34,54,.92);color:#fff;padding:10px 18px;border-radius:22px;font-size:12.5px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 6px 20px rgba(0,0,0,.2);
  max-width:80vw;text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.about{font-size:11.5px;color:var(--muted);line-height:1.8;padding:4px 2px}
.about b{color:var(--ink)}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark"></div>
      <div>壁纸台<small>WALLPAPER STUDIO</small></div>
    </div>
    <div class="top-note">自制壁纸<br>随手保存</div>
  </header>

  <main>
    <!-- 制作 -->
    <section class="tabpane on" id="tab-make">
      <div class="sizebar">
        <span class="lbl">尺寸</span>
        <div class="select-wrap"><select id="sizeSel"></select></div>
        <span class="size-dims" id="sizeDims"></span>
      </div>

      <div class="stage-shell">
        <div class="stage" id="stage">
          <canvas id="preview"></canvas>
          <div class="stage-badge" id="stageBadge"></div>
          <div class="stage-tip">直接拖动文字 / 贴图调整位置</div>
        </div>
      </div>

      <div class="actions">
        <button class="btn ghost" id="btnRandom">换一张</button>
        <button class="btn" id="btnSave">存作品</button>
        <button class="btn primary" id="btnExport">下载壁纸</button>
      </div>

      <div class="seg" id="makeSeg">
        <button data-p="bg" class="on">背景</button>
        <button data-p="text">文字</button>
        <button data-p="sticker">贴图</button>
        <button data-p="fx">质感</button>
      </div>

      <div class="panel on" id="panel-bg"></div>
      <div class="panel" id="panel-text"></div>
      <div class="panel" id="panel-sticker"></div>
      <div class="panel" id="panel-fx"></div>
    </section>

    <!-- 图库 -->
    <section class="tabpane" id="tab-gallery">
      <div class="gallery-head">
        <div><b style="font-size:15px">图库</b><div class="tiny muted">16 款程序化背景，点一下就用</div></div>
        <button class="mini outline" id="btnRefreshAll">换一批</button>
      </div>
      <div class="chips" id="galCats"></div>
      <div class="gallery-grid" id="galGrid"></div>
    </section>

    <!-- 作品 -->
    <section class="tabpane" id="tab-works">
      <div class="card">
        <div class="card-h"><h2>我的作品</h2><span class="hint" id="workCount"></span></div>
        <div class="work-grid" id="workGrid"></div>
      </div>
      <div class="card">
        <div class="card-h"><h2>关于壁纸台</h2></div>
        <div class="about">
          <b>图片</b>：从相册上传，或直接用自带图库。<br>
          <b>文字</b>：可添加多行，拖动位置、调字号颜色。<br>
          <b>导出</b>：按所选机型原始分辨率生成 PNG。<br>
          作品保存在本机浏览器里，不会上传。
        </div>
      </div>
    </section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button data-t="make" class="on"><span class="ic">◈</span><span class="tx">制作</span></button>
    <button data-t="gallery"><span class="ic">▦</span><span class="tx">图库</span></button>
    <button data-t="works"><span class="ic">♡</span><span class="tx">作品</span></button>
  </nav>
</div>
<div class="toast" id="toast"></div>
<script>/* 壁纸台 · 静态数据 + 程序化图库生成器 */

const SIZES = [
  { id: 'ip15pro', name: 'iPhone 15 Pro', w: 1290, h: 2796 },
  { id: 'ip15', name: 'iPhone 15 / 14', w: 1170, h: 2532 },
  { id: 'ipse', name: 'iPhone SE', w: 750, h: 1334 },
  { id: 'android', name: '安卓通用', w: 1080, h: 1920 },
  { id: 'android2k', name: '安卓全面屏', w: 1440, h: 3200 },
  { id: 'ipad', name: 'iPad', w: 2048, h: 2732 }
];

const CATS = [
  { id: 'all', name: '全部' },
  { id: 'gradient', name: '渐变' },
  { id: 'nature', name: '自然' },
  { id: 'geo', name: '几何' },
  { id: 'dark', name: '暗色' }
];

const QUOTES = [
  '慢慢来，比较快',
  '今天也要好好生活',
  '把日子过成喜欢的样子',
  '山高路远，看世界也找自己',
  '允许一切发生',
  '保持热爱，奔赴山海',
  '且听风吟，静待花开',
  '生活明朗，万物可爱',
  '愿你所愿，终能实现',
  '慢一点也没关系',
  '心有山海，静而不争',
  '好事正在路上'
];

const FONTS = [
  { id: 'sans', name: '黑体', css: '"PingFang SC","Microsoft YaHei",sans-serif' },
  { id: 'serif', name: '宋体', css: '"Songti SC","STSong",serif' },
  { id: 'round', name: '圆体', css: '"Yuanti SC","Hiragino Sans GB",sans-serif' },
  { id: 'mono', name: '等宽', css: '"SFMono-Regular",Menlo,monospace' },
  { id: 'kai', name: '楷体', css: '"Kaiti SC","STKaiti",serif' }
];

/* ---------- 小工具 ---------- */

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function _hex(c) {
  if (c[0] === '#') c = c.slice(1);
  if (c.length === 3) c = c[0]+c[0]+c[1]+c[1]+c[2]+c[2];
  return [parseInt(c.slice(0,2),16), parseInt(c.slice(2,4),16), parseInt(c.slice(4,6),16)];
}
function _rgb(c, a) {
  var v = _hex(c);
  return 'rgba(' + v[0] + ',' + v[1] + ',' + v[2] + ',' + (a === undefined ? 1 : a) + ')';
}
function _mix(a, b, t) {
  var x = _hex(a), y = _hex(b);
  return 'rgb(' + Math.round(x[0]+(y[0]-x[0])*t) + ',' + Math.round(x[1]+(y[1]-x[1])*t) + ',' + Math.round(x[2]+(y[2]-x[2])*t) + ')';
}
function _lin(ctx, w, h, stops, angle) {
  var rad = (angle || 0) * Math.PI / 180;
  var x0 = w/2 - Math.cos(rad)*w, y0 = h/2 - Math.sin(rad)*h;
  var x1 = w/2 + Math.cos(rad)*w, y1 = h/2 + Math.sin(rad)*h;
  var g = ctx.createLinearGradient(x0, y0, x1, y1);
  stops.forEach(function (s) { g.addColorStop(s[0], s[1]); });
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
}
function _radial(ctx, x, y, r, stops) {
  var g = ctx.createRadialGradient(x, y, 0, x, y, r);
  stops.forEach(function (s) { g.addColorStop(s[0], s[1]); });
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
}
function _stars(ctx, w, h, rnd, n, tint) {
  for (var i = 0; i < n; i++) {
    var x = rnd()*w, y = rnd()*h*0.86;
    var r = (0.4 + Math.pow(rnd(), 3) * 2.6) * w / 800;
    ctx.globalAlpha = 0.25 + rnd()*0.7;
    ctx.fillStyle = tint || '#ffffff';
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
    if (r > w/800*1.7 && rnd() > 0.7) {
      ctx.strokeStyle = tint || '#ffffff';
      ctx.lineWidth = r*0.35;
      ctx.beginPath();
      ctx.moveTo(x-r*3.2, y); ctx.lineTo(x+r*3.2, y);
      ctx.moveTo(x, y-r*3.2); ctx.lineTo(x, y+r*3.2);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}
function _ridge(ctx, w, h, baseY, amp, color, rnd, steps) {
  steps = steps || 7;
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(0, h);
  var pts = [];
  for (var i = 0; i <= steps; i++) {
    pts.push([w*i/steps, baseY + (rnd()-0.5)*amp + Math.sin(i*1.7)*amp*0.25]);
  }
  ctx.lineTo(0, pts[0][1]);
  for (var j = 0; j < pts.length-1; j++) {
    var xc = (pts[j][0]+pts[j+1][0])/2;
    ctx.quadraticCurveTo(pts[j][0], pts[j][1], xc, (pts[j][1]+pts[j+1][1])/2);
  }
  ctx.lineTo(w, pts[pts.length-1][1]);
  ctx.lineTo(w, h); ctx.closePath(); ctx.fill();
}
function _grain(ctx, w, h, rnd, amount) {
  ctx.save();
  for (var i = 0; i < w*h/900; i++) {
    ctx.fillStyle = 'rgba(255,255,255,' + (rnd()*amount) + ')';
    ctx.fillRect(rnd()*w, rnd()*h, 1.2, 1.2);
  }
  ctx.restore();
}

/* ---------- 图库：每个生成器 (ctx,w,h,rnd) ---------- */

const GENERATORS = [
  {

<script>/* 壁纸台 · 交互逻辑 */

var KEY = 'wallpaper-studio-v1';
var WORKS_KEY = 'wallpaper-works-v1';
var PREVIEW_W = 470;

var $ = function (id) { return document.getElementById(id); };
var clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };

function defaultState() {
  return {
    preset: 'ip15', w: 1170, h: 2532,
    bg: { kind: 'gen', gen: 'mist', seed: 20261123, src: '', x: .5, y: .5, scale: 1, blur: 0, dark: 0 },
    texts: [{
      id: 't1', text: '慢慢来，比较快', x: .5, y: .74, size: .062,
      color: '#FFFFFF', font: 'sans', weight: 600, align: 'center',
      shadow: .55, stroke: 0, opacity: 1, rotate: 0, lineHeight: 1.35, spacing: 0, hidden: false
    }],
    sticker: null,
    fx: { vignette: .18, topShade: 0, bottomShade: .12, grain: .05, border: 0, brightness: 1, contrast: 1, saturate: 1 },
    sel: 't1'
  };
}

var S = defaultState();
var imgCache = {};
var galCat = 'all';
var galSeeds = {};
var curPanel = 'bg';
var drag = null;

/* ---------- 存取 ---------- */

function loadState() {
  try {
    var raw = localStorage.getItem(KEY);
    if (!raw) return;
    var o = JSON.parse(raw);
    if (o && o.bg && Array.isArray(o.texts)) {
      S = Object.assign(defaultState(), o);
      S.fx = Object.assign(defaultState().fx, o.fx || {});
    }
  } catch (e) { /* 忽略损坏数据 */ }
}
function saveState() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('本机空间不足，当前编辑未保存'); }
}
function getWorks() {
  try { return JSON.parse(localStorage.getItem(WORKS_KEY) || '[]'); } catch (e) { return []; }
}
function putWorks(w) {
  try { localStorage.setItem(WORKS_KEY, JSON.stringify(w)); return true; }
  catch (e) { toast('本机空间不足，作品未保存'); return false; }
}

/* ---------- 图片缓存 ---------- */

function loadImage(src, cb) {
  if (!src) return;
  if (imgCache[src]) { if (imgCache[src].complete) cb(imgCache[src]); else imgCache[src].onload = function () { cb(imgCache[src]); }; return; }
  var im = new Image();
  im.onload = function () { cb(im); };
  im.onerror = function () { };
  im.src = src;
  imgCache[src] = im;
}

/* ---------- 统一渲染：预览与导出共用 ---------- */

function fontCss(t, px) {
  var f = FONTS.filter(function (x) { return x.id === t.font; })[0] || FONTS[0];
  return (t.weight || 400) + ' ' + px + 'px ' + f.css;
}

function drawTexts(c, W, H, s) {
  s.texts.forEach(function (t) {
    if (t.hidden) return;
    var px = t.size * W;
    var lines = String(t.text || '').split('\n');
    var lh = px * (t.lineHeight || 1.3);
    var totalH = lh * lines.length;
    var cx = t.x * W, cy = t.y * H;
    var maxW = 0;
    c.save();
    c.font = fontCss(t, px);
    lines.forEach(function (l) { maxW = Math.max(maxW, c.measureText(l).width + (l.length - 1) * (t.spacing || 0) * px); });
    var x0 = t.align === 'left' ? cx : t.align === 'right' ? cx - maxW : cx - maxW / 2;
    var y0 = cy - totalH / 2 + lh * .78;
    c.translate(cx, cy);
    c.rotate((t.rotate || 0) * Math.PI / 180);
    c.translate(-cx, -cy);
    c.globalAlpha = t.opacity === undefined ? 1 : t.opacity;
    c.textAlign = 'left';
    c.textBaseline = 'alphabetic';
    c.font = fontCss(t, px);
    c.lineJoin = 'round';
    c.miterLimit = 2;
    if (t.shadow > 0) {
      c.shadowColor = 'rgba(0,0,0,' + Math.min(.75, .55 * t.shadow) + ')';
      c.shadowBlur = px * .42 * t.shadow;
      c.shadowOffsetY = px * .1 * t.shadow;
    }
    lines.forEach(function (line, i) {
      var y = y0 + i * lh;
      var chars = line.split('');
      var spacing = (t.spacing || 0) * px;
      if (!spacing) {
        if (t.stroke > 0) { c.strokeStyle = 'rgba(0,0,0,' + Math.min(.8, t.stroke) + ')'; c.lineWidth = px * .05; c.strokeText(line, x0, y); }
        c.fillStyle = t.color; c.fillText(line, x0, y);
      } else {
        var cur = x0;
        chars.forEach(function (ch) {
          if (t.stroke > 0) { c.strokeStyle = 'rgba(0,0,0,' + Math.min(.8, t.stroke) + ')'; c.lineWidth = px * .05; c.strokeText(ch, cur, y); }
          c.fillStyle = t.color; c.fillText(ch, cur, y);
          cur += c.measureText(ch).width + spacing;
        });
      }
    });
    c.restore();
  });
}

function drawSticker(c, W, H, s, colorFilter) {
  var st = s.sticker;
  if (!st || !st.src) return;
  var im = imgCache[st.src];
  if (!im || !im.complete || !im.naturalWidth) return;
  var h0 = H * .46 * st.scale;
  var dh = Math.min(h0, H * .9);
  var dw = dh * im.naturalWidth / im.naturalHeight;
  if (dw > W * .92) { dw = W * .92; dh = dw * im.naturalHeight / im.naturalWidth; }
  var cx = st.x * W, cy = st.y * H;
  c.save();
  if (colorFilter) c.filter = colorFilter;
  c.globalAlpha = st.opacity === undefined ? 1 : st.opacity;
  c.translate(cx, cy);
  c.rotate((st.rotate || 0) * Math.PI / 180);
  c.shadowColor = 'rgba(0,0,0,.22)'; c.shadowBlur = W * .03; c.shadowOffsetY = W * .008;
  c.drawImage(im, -dw / 2, -dh / 2, dw, dh);
  c.restore();
}

function renderScene(c, W, H, s, skipFx) {
  c.save();
  c.clearRect(0, 0, W, H);
  c.fillStyle = '#ffffff'; c.fillRect(0, 0, W, H);

  var f0 = s.fx || {};
  var colorFilter = 'brightness(' + (f0.brightness || 1) + ') contrast(' + (f0.contrast || 1) + ') saturate(' + (f0.saturate === undefined ? 1 : f0.saturate) + ')';
  c.filter = colorFilter;

  /* 背景 */
  if (s.bg.kind === 'gen') {
    getGenerator(s.bg.gen).draw(c, W, H, mulberry32(s.bg.seed || 1));
  } else if (s.bg.kind === 'image' && s.bg.src) {
    var im = imgCache[s.bg.src];
    if (im && im.complete && im.naturalWidth) {
      var sc = Math.max(W / im.naturalWidth, H / im.naturalHeight) * (s.bg.scale || 1);
      var dw = im.naturalWidth * sc, dh = im.naturalHeight * sc;
      var dx = W * s.bg.x - dw / 2, dy = H * s.bg.y - dh / 2;
      if (s.bg.blur > 0) c.filter = colorFilter + ' blur(' + (s.bg.blur * W / 500) + 'px)';
      c.drawImage(im, dx, dy, dw, dh);
      c.filter = colorFilter;
      if (s.bg.dark > 0) { c.fillStyle = 'rgba(0,0,0,' + s.bg.dark + ')'; c.fillRect(0, 0, W, H); }
    } else {
      getGenerator('mist').draw(c, W, H, mulberry32(123));
    }
  }

  drawSticker(c, W, H, s, colorFilter);
  c.filter = 'none';

  if (!skipFx) {
    var f = s.fx;
    if (f.topShade > 0) {
      var g1 = c.createLinearGradient(0, 0, 0, H * .4);
      g1.addColorStop(0, 'rgba(0,0,0,' + f.topShade + ')'); g1.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = g1; c.fillRect(0, 0, W, H * .4);
    }
    if (f.bottomShade > 0) {
      var g2 = c.createLinearGradient(0, H * .55, 0, H);
      g2.addColorStop(0, 'rgba(0,0,0,0)'); g2.addColorStop(1, 'rgba(0,0,0,' + f.bottomShade + ')');
      c.fillStyle = g2; c.fillRect(0, H * .55, W, H * .45);
    }
    if (f.vignette > 0) {
      var g3 = c.createRadialGradient(W / 2, H / 2, W * .18, W / 2, H / 2, H * .78);
      g3.addColorStop(0, 'rgba(0,0,0,0)'); g3.addColorStop(1, 'rgba(0,0,0,' + f.vignette + ')');
      c.fillStyle = g3; c.fillRect(0, 0, W, H);
    }
    if (f.grain > 0) {
      var gr = mulberry32(4242);
      for (var i = 0; i < 1600; i++) {
        c.fillStyle = 'rgba(255,255,255,' + (gr() * f.grain) + ')';
        c.fillRect(gr() * W, gr() * H, W * .0016, W * .0016);
      }
    }
  }

  drawTexts(c, W, H, s);

  if (!skipFx && s.fx.border > 0) {
    c.strokeStyle = 'rgba(255,255,255,' + s.fx.border + ')';
    c.lineWidth = W * .012;
    c.strokeRect(W * .006, W * .006, W - W * .012, H - W * .012);
  }
  c.restore();
}

  var works = getWorks();

/* ---------- 导出 ---------- */

function exportPng() {
  toast('正在生成 ' + S.w + '×' + S.h + ' 图片…');
  setTimeout(function () {
    var cv = document.createElement('canvas');
    cv.width = S.w; cv.height = S.h;
    renderScene(cv.getContext('2d'), S.w, S.h, S);
    cv.toBlob(function (blob) {
      if (!blob) { toast('生成失败，请重试'); return; }
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = '壁纸-' + S.w + 'x' + S.h + '-' + Date.now() + '.png';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      toast('已下载，去相册里看看');
    }, 'image/png');
  }, 60);
}

/* ---------- 路径赋值 ---------- */

function setPath(obj, path, val) {
  var parts = path.split('.');

    if (parts[i] === 'sel') {
      var t = S.texts.filter(function (x) { return x.id === S.sel; })[0];
      if (!t) return;
      o = t;

  o[last] = val;
}

    var b = e.target.closest('button[data-t]');

    applyTab(['make', 'gallery', 'works'].indexOf(location.hash.slice(1)) >= 0 ? location.hash.slice(1) : 'make');
  });

  $('sizeSel').addEventListener('change', function () {
    var p = SIZES.filter(function (x) { return x.id === this.value; }, this)[0];
    if (!p) return;
    S.preset = p.id; S.w = p.w; S.h = p.h;
    $('sizeDims').textContent = p.w + '×' + p.h;
    renderPreview(); saveState();
  });

    var b = e.target.closest('button[data-p]');

    S.bg = Object.assign(S.bg, { kind: 'gen', gen: g.id, seed: Math.floor(Math.random() * 1000000) });
    if (S.texts.length && Math.random() > .5) {

    }

  });

    Object.keys(galSeeds).forEach(function (k) { galSeeds[k] = [Math.floor(10000 + Math.random() * 900000)]; });
    renderGallery(); toast('换了一批');
  });

  /* 面板事件委托 */
  ['panel-bg', 'panel-text', 'panel-sticker', 'panel-fx'].forEach(function (id) {
    var el = $(id);
    el.addEventListener('input', onInput);
    el.addEventListener('change', onChange);
    el.addEventListener('click', onClick);
  });
  ['galCats', 'galGrid', 'workGrid'].forEach(function (id) {
    $(id).addEventListener('click', onClick);
  });

  /* 拖动 */
  var cv = $('preview');
  cv.addEventListener('pointerdown', function (e) {
    var r = cv.getBoundingClientRect();
    var x = (e.clientX - r.left) / r.width * PREVIEW_W;
    var y = (e.clientY - r.top) / r.height * cv.height;
    var hit = hitTest(x, y);
    if (!hit) return;
    try { cv.setPointerCapture(e.pointerId); } catch (err) { }
    drag = { type: hit.type, id: hit.id, ox: x - hit.cx, oy: y - hit.cy };
    if (hit.type === 'text') {
      S.sel = hit.id;
      if (curPanel === 'text') renderTextPanel();
    }
    e.preventDefault();
  });
  cv.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var r = cv.getBoundingClientRect();
    var x = (e.clientX - r.left) / r.width * PREVIEW_W;
    var y = (e.clientY - r.top) / r.height * cv.height;
    if (drag.type === 'text') {
      var t = S.texts.filter(function (z) { return z.id === drag.id; })[0];
      if (t) { t.x = clamp((x - drag.ox) / PREVIEW_W, -.1, 1.1); t.y = clamp((y - drag.oy) / cv.height, -.1, 1.1); }
    } else {
      S.sticker.x = clamp((x - drag.ox) / PREVIEW_W, -.1, 1.1);
      S.sticker.y = clamp((y - drag.oy) / cv.height, -.1, 1.1);
    }
    renderPreview(); e.preventDefault();
  });
  ['pointerup', 'pointercancel'].forEach(function (ev) {
    cv.addEventListener(ev, function () { if (drag) { drag = null; saveState(); } });
  });
}

function hitTest(x, y) {
  var W = PREVIEW_W, H = $('preview').height;
  for (var i = S.texts.length - 1; i >= 0; i--) {
    var t = S.texts[i];
    if (t.hidden) continue;
    var px = t.size * W;
    var lines = String(t.text || '').split('\n');
    var lh = px * (t.lineHeight || 1.3);
    var c = $('preview').getContext('2d');
    c.font = fontCss(t, px);
    var mw = 0; lines.forEach(function (l) { mw = Math.max(mw, c.measureText(l).width); });
    var cx = t.x * W, cy = t.y * H;
    if (x > cx - mw / 2 - 14 && x < cx + mw / 2 + 14 && y > cy - lh * lines.length / 2 - 14 && y < cy + lh * lines.length / 2 + 14)
      return { type: 'text', id: t.id, cx: cx, cy: cy };
  }
  if (S.sticker) {
    var dh = H * .46 * S.sticker.scale, dw = dh;
    if (S.sticker.src && imgCache[S.sticker.src] && imgCache[S.sticker.src].naturalWidth) {
      var im = imgCache[S.sticker.src];
      dh = Math.min(dh, H * .9); dw = dh * im.naturalWidth / im.naturalHeight;
      if (dw > W * .92) { dw = W * .92; dh = dw * im.naturalHeight / im.naturalWidth; }
    }
    var sx = S.sticker.x * W, sy = S.sticker.y * H;
    if (Math.abs(x - sx) < dw / 2 && Math.abs(y - sy) < dh / 2) return { type: 'sticker', cx: sx, cy: sy };
  }
  return null;
}

function onInput(e) {
  var el = e.target;
  if (el.hasAttribute('data-prop')) {
    var p = el.getAttribute('data-prop');
    var v = parseFloat(el.value);
    setPath(S, p, v);
    var lab = el.parentNode.querySelector('.val');
    if (lab) {
      var fmt = el.getAttribute('data-fmt');
      lab.textContent = fmt === 'pct' ? Math.round(v * 100) + '%' : (p.indexOf('rotate') >= 0 ? v + '°' : p.indexOf('size') >= 0 ? Math.round(v * 1000) + '‰' : v.toFixed(2));
    }
    renderPreview(); saveState();
  } else if (el.hasAttribute('data-field')) {
    var f = el.getAttribute('data-field');
    if (f === 'text') { var t = getSel(); if (t) { t.text = el.value; renderPreview(); saveState(); } }
    if (f === 'color') { var t2 = getSel(); if (t2) { t2.color = el.value; renderPreview(); saveState(); var b = el.parentNode.querySelector('b'); if (b) b.textContent = el.value; } }
  }
}
function onChange(e) {
  if (e.target.id === 'sizeSel') return;
  if (e.target.hasAttribute('data-field') && e.target.getAttribute('data-field') === 'text') renderTextPanel();
}
function onClick(e) {
  var b = e.target.closest('[data-act]');
  if (!b) return;
  var act = b.getAttribute('data-act');
  var id = b.getAttribute('data-id');
  if (act === 'galcat') { galCat = id; renderGallery(); return; }
  if (act === 'bgcat') { galCat = id; renderBgPanel(); return; }
  if (act === 'shufflethumb') {
    e.stopPropagation();
    var arr = seedFor(id);
    arr[0] = Math.floor(10000 + Math.random() * 900000);
    if (location.hash === '#gallery') renderGallery(); else renderBgPanel();
    return;
  }
  if (act === 'pickgen') {
    var seed = +b.getAttribute('data-seed') || seedFor(id)[0];
    S.bg = Object.assign(S.bg, { kind: 'gen', gen: id, seed: seed });
    renderPreview(); renderPanel(); saveState();
    if (location.hash === '#gallery') { go('make'); toast('已应用「' + getGenerator(id).name + '」'); }
    return;
  }
  if (act === 'uploadbg') { pickFile('bg'); return; }
  if (act === 'clearbg') { S.bg.kind = 'gen'; renderPreview(); renderPanel(); saveState(); return; }
  if (act === 'addtext') {
    var nt = {
      id: 't' + Date.now(), text: '在这里写点什么', x: .5, y: .45, size: .06,
      color: '#FFFFFF', font: 'sans', weight: 600, align: 'center',
      shadow: .5, stroke: 0, opacity: 1, rotate: 0, lineHeight: 1.35, spacing: 0, hidden: false
    };
    S.texts.push(nt); S.sel = nt.id;
    renderPreview(); renderTextPanel(); saveState(); return;
  }
  if (act === 'quote') {
    var nq = {
      id: 't' + Date.now(), text: b.getAttribute('data-text'), x: .5, y: .45, size: .06,
      color: '#FFFFFF', font: 'sans', weight: 600, align: 'center',
      shadow: .5, stroke: 0, opacity: 1, rotate: 0, lineHeight: 1.35, spacing: 0, hidden: false
    };
    S.texts.push(nq); S.sel = nq.id;
    renderPreview(); renderTextPanel(); saveState(); toast('已添加，可拖动调整位置'); return;
  }
  if (act === 'seltext') { S.sel = id; renderTextPanel(); return; }
  if (act === 'hidetext') {
    e.stopPropagation();
    var ht = S.texts.filter(function (t) { return t.id === id; })[0];
    if (ht) ht.hidden = !ht.hidden;
    renderPreview(); renderTextPanel(); saveState(); return;
  }
  if (act === 'deltext') {
    e.stopPropagation();
    S.texts = S.texts.filter(function (t) { return t.id !== id; });
    if (S.sel === id) S.sel = S.texts.length ? S.texts[S.texts.length - 1].id : null;
    renderPreview(); renderTextPanel(); saveState(); return;
  }
  if (act === 'duptext') {
    var src = getSel(); if (!src) return;
    var cp = JSON.parse(JSON.stringify(src)); cp.id = 't' + Date.now(); cp.y = clamp(cp.y - .08, 0, 1);
    S.texts.push(cp); S.sel = cp.id; renderPreview(); renderTextPanel(); saveState(); return;
  }
  if (act === 'setcolor') { var t = getSel(); if (t) { t.color = b.getAttribute('data-color'); renderPreview(); renderTextPanel(); saveState(); } return; }
  if (act === 'setfont') { var t = getSel(); if (t) { t.font = id; renderPreview(); renderTextPanel(); saveState(); } return; }
  if (act === 'setweight') { var t = getSel(); if (t) { t.weight = +b.getAttribute('data-v'); renderPreview(); renderTextPanel(); saveState(); } return; }
  if (act === 'setalign') { var t = getSel(); if (t) { t.align = b.getAttribute('data-v'); renderPreview(); renderTextPanel(); saveState(); } return; }
  if (act === 'uploadsticker') { pickFile('sticker'); return; }
  if (act === 'delsticker') { S.sticker = null; renderPreview(); renderStickerPanel(); saveState(); return; }
  if (act === 'resetfx') {
    S.fx = { vignette: .18, topShade: 0, bottomShade: .12, grain: .05, border: 0, brightness: 1, contrast: 1, saturate: 1 };
    renderPreview(); renderFxPanel(); saveState(); return;
  }
  if (act === 'openwork') {
    var w = getWorks().filter(function (x) { return String(x.id) === String(id); })[0];
    if (!w) return;
    S = JSON.parse(JSON.stringify(w.state));
    if (w.state.bg.src) loadImage(w.state.bg.src, renderPreview);
    if (w.state.sticker && w.state.sticker.src) loadImage(w.state.sticker.src, renderPreview);
    syncSize(); renderPreview(); renderPanel(); go('make'); toast('已载入作品'); return;
  }
  if (act === 'delwork') {
    e.stopPropagation();
    putWorks(getWorks().filter(function (x) { return String(x.id) !== String(id); }));
    renderWorks(); toast('已删除'); return;
  }
}

/* ---------- 上传图片 ---------- */

function applyPickedFile(kind, f) {
  if (!f) return;
  var fr = new FileReader();
  fr.onload = function () {
    var im = new Image();
    im.onload = function () {
      var max = kind === 'sticker' ? 1200 : 1600;
      var sc = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
      var cv = document.createElement('canvas');
      cv.width = Math.round(im.naturalWidth * sc); cv.height = Math.round(im.naturalHeight * sc);
      var c = cv.getContext('2d');
      c.drawImage(im, 0, 0, cv.width, cv.height);
      var data = kind === 'sticker' ? cv.toDataURL('image/png') : cv.toDataURL('image/jpeg', .88);
      if (kind === 'bg') {
        S.bg = Object.assign(S.bg, { kind: 'image', src: data, x: .5, y: .5, scale: 1, blur: 0, dark: 0 });
      } else {
        S.sticker = { src: data, x: .5, y: .45, scale: 1, rotate: 0, opacity: 1 };
      }
      loadImage(data, renderPreview);
      renderPreview(); renderPanel(); saveState();
      toast(kind === 'bg' ? '背景已替换，可拖动调整' : '贴图已加上，可拖动调整');
    };
    im.src = fr.result;
  };
  fr.readAsDataURL(f);
}

function pickFile(kind) {
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = function () { applyPickedFile(kind, inp.files && inp.files[0]); };
  inp.click();
}

function syncSize() {
  $('sizeSel').value = S.preset;
  $('sizeDims').textContent = S.w + '×' + S.h;
}

/* ---------- 启动 ---------- */

function boot() {
  $('sizeSel').innerHTML = SIZES.map(function (p) {
    return '<option value="' + p.id + '">' + p.name + '</option>';
  }).join('');
  loadState();
  syncSize();
  saveState();
  if (S.bg.src) loadImage(S.bg.src, renderPreview);
  if (S.sticker && S.sticker.src) loadImage(S.sticker.src, renderPreview);
  bindEvents();
  renderPreview();
  renderPanel();
  applyTab(['make', 'gallery', 'works'].indexOf(location.hash.slice(1)) >= 0 ? location.hash.slice(1) : 'make');
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(function () { });
  }
}
boot();
</script>
